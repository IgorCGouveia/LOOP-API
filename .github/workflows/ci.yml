name: CI

on:
  push:
    branches: [LOOP-v2, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: loop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/loop_test?schema=public
      # Valor de teste — não é segredo real (banco efêmero, token descartável).
      # Usa o secret do repo se existir; senão cai no literal (cobre PR de fork,
      # que não enxerga secrets). Segredo de produção vive no dashboard do Render.
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-nao-real-0123456789' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # /src/generated/prisma está no .gitignore — precisa gerar o client.
      - run: npx prisma generate

      # Vitest transpila sem checar tipos; este step é o gate de tipo (fail-fast).
      - run: npx tsc --noEmit

      - run: npx prisma migrate deploy

      - run: npm test
